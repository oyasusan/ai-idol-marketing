name: Backfill TikTok Narration Fields

# generated_contents.id (platform=TikTok) を指定して、
# narration_text/search_keywordsが欠けている場合にGroqで事後補完し、DBへcommitする。
#
# 【重要】実際の動画レンダリング(素材取得→音声合成→縦型動画合成)はこのワークフローでは
# 行わない。GitHub Actionsランナー(データセンターIP)からのyt-dlp経由のYouTube取得は、
# cookie認証・client偽装・JS runtime指定など可能な対策を試したが、YouTube側の
# SABRストリーミング実験(bot対策)によりPO Tokenなしでは全フォーマットが拒否され
# 解決できなかった(2026-08-19時点)。動画のレンダリングはローカル環境で
# `python src/video/render_tiktok.py --content-id <ID>` を実行すること
# (このワークフローでDBをcommitした後、ローカルで `git pull` してから実行する)。
#
# - 補完(backfill_narration.py)がDBへ書き込みを行うため GROQ_API_KEY と
#   `permissions: contents: write` が必要（補完が不要なレコードでは書き込みは発生しない）。
on:
  workflow_dispatch:
    inputs:
      content_id:
        description: "generated_contents.id (platform=TikTok の投稿案)"
        required: true
        type: string

permissions:
  contents: write

# data/database.sqlite への書き込み・pushがdaily_pipeline.ymlと競合しないよう、
# 同じconcurrencyグループで直列化する（cancel-in-progress: falseで両方とも実行を維持）。
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Backfill narration_text / search_keywords if missing
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python src/video/backfill_narration.py --content-id "${{ inputs.content_id }}"

      - name: Commit and push backfilled DB (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/database.sqlite

          if git diff --staged --quiet; then
            echo "変更がないためコミットをスキップします。"
            exit 0
          fi

          git commit -m "chore: TikTok動画台本のnarration_text/search_keywordsを補完 (content_id=${{ inputs.content_id }})"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
