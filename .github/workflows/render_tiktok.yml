name: Render TikTok Video

# generated_contents.id (platform=TikTok) を指定して、
# 【不足があればnarration_text/search_keywordsをGroqで事後補完→DBへcommit】→
# キーワード抽出→素材自動取得→ナレーション音声生成→縦型動画合成を手動実行する。
#
# - 補完(backfill_narration.py)がDBへ書き込みを行うため GROQ_API_KEY と
#   `permissions: contents: write` が必要（補完が不要なレコードでは書き込みは発生しない）。
# - 動画素材は空想ロマンス公式チャンネルの既知動画のみに限定される
#   (詳細は src/video/fetcher.py を参照)。
# - GitHub Actionsのランナー(データセンターIP)からの素の取得はYouTube側の
#   bot判定("Sign in to confirm you're not a bot")に阻まれるため、任意で
#   YOUTUBE_COOKIES シークレット（ログイン済みブラウザから書き出した
#   Netscape形式cookies.txtの中身）を設定するとcookie認証を使う。
#   未設定でも動作するが、その場合YouTube側のブロック次第で素材取得に失敗しうる。
# - 生成された動画は大容量のためリポジトリへはコミットせず、
#   このワークフローの Artifacts からダウンロードする。
on:
  workflow_dispatch:
    inputs:
      content_id:
        description: "generated_contents.id (platform=TikTok の投稿案)"
        required: true
        type: string

permissions:
  contents: write

# data/database.sqlite への書き込み・pushがdaily_pipeline.ymlと競合しないよう、
# 同じconcurrencyグループで直列化する（cancel-in-progress: falseで両方とも実行を維持）。
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies (ffmpeg, Japanese fonts)
        env:
          # needrestartがカーネル/ライブラリ更新時に対話的な再起動確認ダイアログを
          # 出そうとしてハングし、ジョブ全体がtimeout-minutesで強制キャンセルされる
          # ことがあるため、非対話モードを明示する（DEBIAN_FRONTENDだけでは
          # needrestart自体のダイアログを抑制しきれない場合があるため両方指定）。
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Backfill narration_text / search_keywords if missing
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python src/video/backfill_narration.py --content-id "${{ inputs.content_id }}"

      - name: Commit and push backfilled DB (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/database.sqlite

          if git diff --staged --quiet; then
            echo "変更がないためコミットをスキップします。"
            exit 0
          fi

          git commit -m "chore: TikTok動画台本のnarration_text/search_keywordsを補完 (content_id=${{ inputs.content_id }})"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Prepare YouTube cookies (optional)
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            echo "$YOUTUBE_COOKIES" > "${RUNNER_TEMP}/youtube_cookies.txt"
            echo "YOUTUBE_COOKIES_FILE=${RUNNER_TEMP}/youtube_cookies.txt" >> "$GITHUB_ENV"
            echo "YOUTUBE_COOKIES シークレットを使用します。"
          else
            echo "YOUTUBE_COOKIES シークレットが未設定のため、cookieなしで実行します。"
          fi

      - name: Render TikTok video
        run: python src/video/render_tiktok.py --content-id "${{ inputs.content_id }}"

      - name: Upload rendered video as artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-video-${{ inputs.content_id }}
          path: content/videos/*.mp4
          retention-days: 14
          if-no-files-found: error
