name: Daily Pipeline

# スケジュール実行はGitHub Actionsのネイティブcron(`schedule:`)を使わず、
# cron-job.org からのHTTPリクエストで `workflow_dispatch` を呼び出す方式にしている。
# GitHub Actionsの `schedule:` はプラットフォーム側の負荷により実行時刻が
# 数分〜数十分ずれることがあるため、定時実行の精度を優先してこの構成にした。
on:
  workflow_dispatch: {}

permissions:
  contents: write

# 手動実行と外部トリガーによる実行が重ならないようにする
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    # Groq無料枠のレート制限対策で各API呼び出しの間に待機を挟むため、
    # 生成(最大5件)・評価(最大20件)を合わせると余裕を持たせる必要がある。
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline (collect -> analyze -> generate -> evaluate -> report)
        # データ収集は youtube-analytics リポジトリ(oyasusan/youtube-analytics)の
        # 公開DBファイルを認証なしで取り込む方式 (src/collectors/youtube_analytics_import.py)
        # のため、YOUTUBE_API_KEY / YOUTUBE_CHANNEL_ID は不要。
        # (YouTube Data APIを直接叩く代替実装 src/collectors/youtube.py を
        #  main.py から使う場合のみ、この2つのSecretsが必要になる)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python src/main.py

      - name: Commit and push generated DB / reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/database.sqlite reports/ content/drafts/

          if git diff --staged --quiet; then
            echo "変更がないためコミットをスキップします。"
            exit 0
          fi

          git commit -m "chore: 日次パイプライン自動実行 ($(date -u +'%Y-%m-%d'))"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
